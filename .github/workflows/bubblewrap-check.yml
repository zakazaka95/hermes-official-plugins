name: bubblewrap contribution validation
on:
  push:
    branches: [validation/bubblewrap-file-search]
permissions:
  contents: read
jobs:
  bubblewrap:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/hermes-agent
      HERMES_AGENT_REPO: ${{ github.workspace }}/hermes-agent
      HERMES_HOME: ${{ github.workspace }}/hermes-validation-home
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugins
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: c7da41dd522dc19cc08bbfcfa69d4b078224b45d
          path: hermes-agent
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Prepare Linux test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap ripgrep
          bwrap --unshare-user --ro-bind / / true
          python -m pip install uv
          python -c 'import sys,tomllib; print("\n".join(tomllib.load(open(sys.argv[1], "rb")).get("tool", {}).get("uv", {}).get("override-dependencies", [])))' hermes-agent/pyproject.toml > "$RUNNER_TEMP/core-overrides.txt"
          python -m uv pip install --system --override "$RUNNER_TEMP/core-overrides.txt" -e ./hermes-agent pytest pytest-asyncio
      - name: Validate Bubblewrap manifest
        run: python -m hermes_cli.main plugins validate plugins/bubblewrap
      - name: Confirm the regression fails on the original backend
        working-directory: plugins/bubblewrap
        run: |
          git show 01fa168f3608185e8ce9ab7bcc1dbc60d5fa6731:bubblewrap/sandbox.py > sandbox.py
          set +e
          python -m pytest -q tests/test_bubblewrap_integration.py -k 'file_tools_resolve_ripgrep_in_the_command_namespace or search_ignores_the_hidden_host_ripgrep' --junitxml="$RUNNER_TEMP/bubblewrap-red.xml"
          red_status=$?
          set -e
          git restore --source=HEAD -- sandbox.py
          test "$red_status" -eq 1
          python -c 'import sys,xml.etree.ElementTree as E; s=E.parse(sys.argv[1]).getroot().find("testsuite"); assert (s.attrib["tests"], s.attrib["failures"], s.attrib["errors"], s.attrib["skipped"]) == ("9", "9", "0", "0"), s.attrib; print("All 9 new regressions fail on the original backend, without errors or skips")' "$RUNNER_TEMP/bubblewrap-red.xml"
      - name: Run the complete Bubblewrap suite
        working-directory: plugins/bubblewrap
        run: python -m pytest -q --junitxml="$RUNNER_TEMP/bubblewrap-green.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bubblewrap-test-results
          path: ${{ runner.temp }}/bubblewrap-*.xml
